<!DOCTYPE html>
<html>
<head>
    <title>Payment</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #36d1dc, #5b86e5);
            font-family: Arial;
        }

        .payment-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 400px;
            margin: auto;
            margin-top: 60px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.2);
        }

        .btn {
            border-radius: 20px;
        }

        .upi-apps img {
            width: 50px;
            margin: 8px;
        }
    </style>
</head>

<body>

<div class="payment-box text-center">

    <h3 class="mb-3">💳 Payment</h3>

    <form method="POST" action="/process_payment">

        <!-- PAYMENT OPTIONS -->
        <div class="mb-3 text-start">
            <label><input type="radio" name="method" value="cod" onclick="showCOD()"> Cash on Delivery</label><br>
            <label><input type="radio" name="method" value="upi" onclick="showUPI()"> UPI Payment</label>
        </div>

        <!-- COD SECTION -->
        <div id="codBox" style="display:none;">
            <input name="name" class="form-control mb-2" placeholder="Name" required>
            <input name="phone" class="form-control mb-2" placeholder="Phone" required>
            <input name="address" class="form-control mb-2" placeholder="Address" required>
        </div>

        <!-- UPI SECTION -->
        <div id="upiBox" style="display:none;">

            <h5>Scan & Pay</h5>

            <!-- QR CODE -->
            <img src="{{ url_for('static', filename='qr.png') }}" width="180">

            <p class="mt-2">Use any UPI App</p>

            <!-- UPI APPS -->
            <div class="upi-apps">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/5f/Google_Pay_Logo.svg">
                <img src="https://upload.wikimedia.org/wikipedia/commons/f/f2/PhonePe_Logo.svg">
                <img src="https://upload.wikimedia.org/wikipedia/commons/4/42/Paytm_logo.png">
            </div>

            <input name="upi_id" class="form-control mt-2" placeholder="Enter UPI ID (optional)">
        </div>

        <!-- BUTTON -->
        <button class="btn btn-success w-100 mt-3">Pay Now</button>

    </form>

</div>

<!-- TOGGLE SCRIPT -->
<script>
function showCOD() {
    document.getElementById("codBox").style.display = "block";
    document.getElementById("upiBox").style.display = "none";
}

function showUPI() {
    document.getElementById("upiBox").style.display = "block";
    document.getElementById("codBox").style.display = "none";
}
</script>

</body>
</html>
