<!DOCTYPE html>
<html>
<head>
    <title>Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

<h2 class="text-center">Your Cart 🛒</h2>

{% if cart %}

<div class="card p-4 shadow">

{% for item in cart %}
<div class="d-flex justify-content-between align-items-center border-bottom mb-2 pb-2">

    <div>
        <strong>{{ item.name }}</strong><br>
        ₹{{ item.price }}
    </div>

    <!-- ❌ REMOVE BUTTON -->
    <a href="/remove_from_cart/{{ item.name }}" class="btn btn-danger btn-sm">
        Remove
    </a>

</div>
{% endfor %}

<h4 class="text-end">Total: ₹{{ total }}</h4>

<a href="/payment" class="btn btn-success w-100 mt-3">
    Proceed to Payment
</a>

</div>

{% else %}
<h4 class="text-center text-danger">Cart is empty 😢</h4>
{% endif %}

<div class="text-center mt-3">
    <a href="/" class="btn btn-dark">Continue Shopping</a>
</div>

</div>

</body>
</html>
