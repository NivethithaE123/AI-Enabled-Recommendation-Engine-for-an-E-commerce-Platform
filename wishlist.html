<!DOCTYPE html>
<html>
<head>
    <title>Wishlist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

<h2 class="text-center">Your Wishlist ❤️</h2>

{% if wishlist %}

<div class="card p-4 shadow">

{% for item in wishlist %}
<div class="d-flex justify-content-between align-items-center border-bottom mb-2 pb-2">

    <div>
        <strong>{{ item.name }}</strong><br>
        ₹{{ item.price }}
    </div>

    <!-- ❌ REMOVE -->
    <a href="/remove_from_wishlist/{{ item.name }}" class="btn btn-danger btn-sm">
        Remove
    </a>

</div>
{% endfor %}

</div>

{% else %}
<h4 class="text-center text-danger">Wishlist is empty 😢</h4>
{% endif %}

<div class="text-center mt-3">
    <a href="/" class="btn btn-dark">Back to Shopping</a>
</div>

</div>

</body>
</html>
